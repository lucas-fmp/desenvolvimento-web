<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douglas Matos - Fotógrafo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div id="shared-header"></div>

    <header>
        <h1>Douglas Matos - Fotógrafo</h1>
        <p>Ensaio fotográfico profissional - Casamentos, retratos e muito mais.</p>
    </header>

    <main>
        <section id="15-anos">
            <h2>15 Anos</h2>
            <div id="carousel15Anos" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="fotos/15 anos/1.jpg" class="d-block w-100" alt="15 Anos 1">
                    </div>
                    <div class="carousel-item">
                        <img src="fotos/15 anos/2.jpg" class="d-block w-100" alt="15 Anos 2">
                    </div>
                    <div class="carousel-item">
                        <img src="fotos/15 anos/3.jpg" class="d-block w-100" alt="15 Anos 3">
                    </div>
                    <div class="carousel-item">
                        <img src="fotos/15 anos/4.jpg" class="d-block w-100" alt="15 Anos 4">
                    </div>
                    <div class="carousel-item">
                        <img src="fotos/15 anos/5.jpg" class="d-block w-100" alt="15 Anos 5">
                    </div>
                    <div class="carousel-item">
                        <img src="fotos/15 anos/6.jpg" class="d-block w-100" alt="15 Anos 6">
                    </div>
                    <div class="carousel-item">
                        <img src="fotos/15 anos/7.jpg" class="d-block w-100" alt="15 Anos 7">
                    </div>
                    <div class="carousel-item">
                        <img src="fotos/15 anos/8.jpg" class="d-block w-100" alt="15 Anos 8">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carousel15Anos" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carousel15Anos" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
            <audio controls>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            </audio>
        </section>

        <section id="criancas">

            <audio controls>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
